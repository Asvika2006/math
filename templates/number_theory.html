{% extends "base.html" %}
{% block content %}
<h2>Number Theory Solver</h2>
<form method="POST" action="/number-theory">
    <div class="mb-3">
        <label class="form-label">Enter Numbers (separated by spaces)</label>
        <input type="text" name="numbers" class="form-control" required placeholder="Example: 12 18">
    </div>
    <div class="mb-3">
        <label class="form-label">Select Operation</label>
        <select name="operation" class="form-select" required>
            <option value="gcd">GCD</option>
            <option value="lcm">LCM</option>
            <option value="isprime">Prime Check</option>
            <option value="factor">Prime Factorization</option>
        </select>
    </div>
    <button class="btn btn-success" type="submit">Compute</button>
</form>

{% if result %}
<div class="alert alert-info mt-4">
    <strong>Result:</strong> {{ result }}
</div>
{% endif %}
{% endblock %}
